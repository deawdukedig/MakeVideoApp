name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # อนุญาตให้กดรัน Build เองได้จากหน้าเว็บ GitHub

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Single File EXE
        run: dotnet publish MakeVideoApp.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o ./output

      - name: Upload MakeVideoApp.exe Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MakeVideoApp-win-x64
          path: ./output/MakeVideoApp.exe
          if-no-files-found: error

      # สร้างหน้า Release พร้อมแนบไฟล์ .exe อัตโนมัติเมื่อมีการ Push Tag (เช่น git tag v1.0.0 && git push --tags)
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ./output/MakeVideoApp.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
