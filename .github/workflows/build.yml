name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write # เพิ่มสิทธิ์ให้ GITHUB_TOKEN สามารถสร้าง Release และแนบไฟล์ได้

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Publish Single File EXE
        run: dotnet publish MakeVideoApp.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -o ./output

      - name: Upload MakeVideoApp.exe Artifact
        uses: actions/upload-artifact@v7
        with:
          name: MakeVideoApp-win-x64
          path: ./output/MakeVideoApp.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: ./output/MakeVideoApp.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}